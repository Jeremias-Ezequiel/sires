<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 - Recurso No Encontrado | SIRES</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="/sires/public/css/global.css">
    <link rel="stylesheet" href="/sires/public/css/pages/error.css">
</head>

<body>

    <div class="error-page-container">

        <h1 class="error-code">404</h1>

        <div class="error-card">
            <h2>Recurso no encontrado</h2>
            <p>
                Lo sentimos, la página o el recurso que estás intentando buscar no existe en el sistema SIRES o ha
                sido movido de forma permanente.
            </p>

            <a href="/sires/dashboard" class="btn btn--outline" onclick="event.preventDefault(); history.back();">
                <i class="fa-solid fa-arrow-left"></i> Volver al inicio
            </a>
        </div>

    </div>

</body>

</html>
